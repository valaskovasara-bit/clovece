<!doctype html><html lang="cs"><head><title>ČLOVĚČE, NEZLOB SE</title><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#101927;color:#f2f6ff;font:16px system-ui;padding:12px}main{max-width:740px;margin:auto}h1{margin:5px 0 8px;font-size:25px}.panel{background:#1b293d;border:1px solid #33465d;border-radius:15px;padding:12px;margin:9px 0}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button,select{background:#304763;color:white;border:1px solid #526b87;border-radius:10px;min-height:43px;padding:8px 12px;font-size:16px;font-weight:700}button:disabled{opacity:.35}.danger{background:#69313c}.primary{background:#276cbb}.active{outline:3px solid #ffd166}small,.muted{color:#bdc9d9}#board{width:min(100%,430px);height:auto;display:block;margin:auto;touch-action:manipulation}#board text{pointer-events:none;font-weight:800} .pieces{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.piece{padding:8px 4px;min-height:70px;white-space:normal;font-size:14px}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.keypad button{padding:8px 2px;min-width:0}.status{padding:10px;border-radius:9px;background:#263c55;font-weight:700}.hidden{display:none}input{width:100%;background:#23354c;color:white;border:1px solid #526b87;border-radius:8px;padding:8px;font-size:16px} .scroll{overflow-x:auto} .player{border-left:5px solid var(--pc);padding-left:9px;margin:10px 0} .chip{border-radius:20px;padding:4px 8px;background:#33465d} .notice{color:#ffe3a3}</style></head><body><main><h1>🎯 ČLOVĚČE, NEZLOB SE</h1><p class="muted">SÁJA ❤️ &nbsp; VOKUREK 💙 • samostatná hra • automatické ukládání</p><div class="panel row between"><div><strong id="turnLabel"></strong><div class="muted" id="phase"></div></div><button onclick="undo()">↶ ZPĚT</button></div><svg id="board" viewBox="0 0 440 440" aria-label="Přehled pozic figurek na šipkovém terči"></svg><div class="panel" id="players"></div><div class="panel"><div class="row between"><strong id="entryTitle">Zásah šipkou</strong><span id="dartInfo" class="chip"></span></div><div class="row" id="multipliers"><button id="m1" onclick="setMult(1)">Single</button><button id="m2" onclick="setMult(2)">Double</button><button id="m3" onclick="setMult(3)">Triple</button></div><div class="keypad" id="keypad"></div><div class="row" style="margin-top:8px"><button onclick="hit(0,1)">MIMO (0)</button><button onclick="hit(25,1)">Bull 25</button><button onclick="hit(50,1)">Bull 50</button></div></div><div class="panel"><div class="status" id="message"></div><div class="row" style="margin-top:9px"><button class="primary" onclick="nextTurn()">Další hráč →</button><button onclick="undo()">↶ Vrátit</button></div></div><details class="panel"><summary>⚙️ Nastavení / nová hra</summary><p class="notice">Nová hra smaže rozehranou partii až po potvrzení.</p><button class="danger" onclick="resetGame()">Nová hra</button></details><p class="muted">Pro každou změnu použij ZPĚT. Hra se ukládá do tohoto prohlížeče.</p></main><script>const GAME="clovece";const seq=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];const colors=['#ed5963','#4b9bff','#f5c15c','#54c9a1','#b992ff','#ff9a5a','#e579c9','#a8d66c'];const KEY='sipky-'+GAME+'-v3';let state,history=[],mult=1;function fresh(){return {players:[{name:'SÁJA',pieces:[{pos:0,cp:false},{pos:null,cp:false},{pos:null,cp:false}]},{name:'VOKUREK',pieces:[{pos:0,cp:false},{pos:null,cp:false},{pos:null,cp:false}]}],turn:0,darts:0,log:[],winner:null,phase:'dice',dice:[],used:[],targetPiece:0,progress:0,origin:0,selected:0,rollCount:0}}function save(){localStorage.setItem(KEY,JSON.stringify({state,history:history.slice(-100)}))}function snapshot(){history.push(JSON.stringify(state));if(history.length>100)history.shift();save()}function undo(){if(!history.length){alert('Zatím není co vrátit.');return}state=JSON.parse(history.pop());save();render()}function resetGame(){if(!confirm('Opravdu začít novou hru? Rozehraná partie se smaže.'))return;state=fresh();history=[];save();render()}function setMult(m){mult=m;renderMultipliers()}function renderMultipliers(){for(let m=1;m<=3;m++)document.getElementById('m'+m).classList.toggle('active',mult===m)}function setupKeypad(){document.getElementById('keypad').innerHTML=Array.from({length:20},(_,i)=>`<button onclick="hit(${i+1},mult)">${i+1}</button>`).join('')}function init(){try{let v=JSON.parse(localStorage.getItem(KEY));state=v.state||fresh();history=v.history||[]}catch(e){state=fresh()}setupKeypad();render()}function board(){let svg=document.getElementById('board');let c=220,R=205,inner=75;let out=`<circle cx="220" cy="220" r="212" fill="#101927" stroke="#6c8299" stroke-width="2"/>`;for(let i=0;i<20;i++){let a=(-90+i*18-9)*Math.PI/180,b=(-90+i*18+9)*Math.PI/180;let x1=c+R*Math.cos(a),y1=c+R*Math.sin(a),x2=c+R*Math.cos(b),y2=c+R*Math.sin(b);out+=`<path d="M ${c} ${c} L ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2} Z" fill="${i%2?'#293b50':'#34485d'}" stroke="#6a7e90" stroke-width="1"/><text x="${c+180*Math.cos((a+b)/2)}" y="${c+180*Math.sin((a+b)/2)+5}" fill="white" text-anchor="middle" font-size="17">${seq[i]}</text>`}out+=`<circle cx="220" cy="220" r="35" fill="#378b6c" stroke="#fff" stroke-width="2"/><circle cx="220" cy="220" r="17" fill="#bd4a5a"/>`;let spots={};state.players.forEach((p,pi)=>p.pieces.forEach((piece,j)=>{if(piece.pos===null||piece.pos==='home'||piece.pos===0)return;let k=String(piece.pos==='before3'?3:piece.pos);(spots[k]??=[]).push({pi,j})}));Object.entries(spots).forEach(([k,arr])=>{let idx=seq.indexOf(Number(k));let angle=idx<0?(-90+(Number(k)-21)*70)*Math.PI/180:(-90+idx*18)*Math.PI/180;let rad=idx<0?52:128;arr.forEach(({pi,j},n)=>{let x=c+rad*Math.cos(angle)+(n%3-1)*12,y=c+rad*Math.sin(angle)+Math.floor(n/3)*14;out+=`<circle cx="${x}" cy="${y}" r="12" fill="${colors[pi]}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#071422" font-size="14">${j+1}</text>`})});svg.innerHTML=out}function playerMarkup(){return state.players.map((p,pi)=>`<div class="player" style="--pc:${colors[pi]}"><div class="row between"><strong style="color:${colors[pi]}">${p.name}</strong>${state.turn===pi?'<span class="chip">PRÁVĚ HÁZÍ</span>':''}</div><div class="pieces">${p.pieces.map((q,j)=>`<button class="piece ${state.turn===pi&&state.selected===j?'active':''}" onclick="choosePiece(${pi},${j})" style="border-color:${colors[pi]}">Figurka ${j+1}<div>${q.pos===null?'ČEKÁ':q.pos==='home'?'🏠 DOMA':q.pos===0?'START':q.pos==='before3'?'PŘED 3':q.pos}</div>${GAME==='vyrazko'&&q.cp?'<small>✓ bod 3</small>':''}</button>`).join('')}</div></div>`).join('')}function render(){document.getElementById('turnLabel').textContent=state.winner!==null?'🏆 Vítěz: '+state.players[state.winner].name:'🎯 '+state.players[state.turn].name;document.getElementById('dartInfo').textContent='Šipka '+(state.darts+1)+'/3';document.getElementById('players').innerHTML=playerMarkup();renderMultipliers();board();renderGame()}function nextTurn(){if(state.winner!==null)return;snapshot();state.turn=(state.turn+1)%state.players.length;state.darts=0;state.selected=0;state.progress=0;state.phase=GAME==='clovece'?'dice':'throw';state.dice=[];state.used=[];state.rollCount=0;save();render()}function finishCheck(){let i=state.players.findIndex(p=>p.pieces.every(q=>q.pos==='home'));if(i>=0)state.winner=i}function choosePiece(pi,j){if(pi!==state.turn||state.winner!==null)return;selectPiece(j)}window.addEventListener('load',init);function selectPiece(j){state.selected=j;state.progress=0;render()}function roll(n){if(state.winner!==null||state.phase!=='dice')return;snapshot();state.dice.push(n);state.used.push(false);state.rollCount++;if(n===6&&state.rollCount<6){state.phase='dice'}else if(state.rollCount>=3||state.players[state.turn].pieces.some(q=>q.pos!==null)){state.phase='throw'}save();render()}function startThrow(){if(state.winner!==null)return;snapshot();state.phase='throw';save();render()}function pickDie(i){if(state.phase!=='throw'||state.used[i])return;snapshot();state.dieIndex=i;state.progress=0;save();render()}function deploy(){let p=state.players[state.turn];let i=state.dice.findIndex((d,k)=>d===6&&!state.used[k]);let j=p.pieces.findIndex(q=>q.pos===null);if(i<0||j<0||p.pieces.some(q=>q.pos===0))return; snapshot();p.pieces[j].pos=0;state.used[i]=true;state.selected=j;state.dieIndex=state.dice.findIndex((d,k)=>!state.used[k]);save();render()}function hit(n,m){if(state.winner!==null||state.phase!=='throw'||state.darts>=3)return;let p=state.players[state.turn],q=p.pieces[state.selected];if(!q||q.pos===null||q.pos==='home')return;let di=state.dieIndex;if(di===undefined||state.used[di])di=state.dice.findIndex((d,i)=>!state.used[i]);if(di<0)return;let die=state.dice[di],target=(q.pos===0?0:q.pos)+die;let score=n===25||n===50?n:n*m;snapshot();state.darts++;state.progress+=score;let msg='';if(target>25){msg='Cíl přesahuje domeček – tah nelze dokončit';state.phase='done'}else if(target===25){if(n===25||n===50){q.pos='home';state.used[di]=true;state.progress=0;msg='Figurka je DOMA!'}else{msg='Pro domeček je nutný Bull';}}else if(state.progress===target){if(p.pieces.some((x,i)=>i!==state.selected&&x.pos===target)){msg='Na cíli už stojí vlastní figurka – pohyb nelze provést';state.phase='done'}else{q.pos=target;state.used[di]=true;state.progress=0;state.players.forEach((opp,pi)=>{if(pi===state.turn)return;opp.pieces.forEach(x=>{if(x.pos===target)x.pos=null})});msg='Úspěšný posun na '+target}}else if(state.progress>target){state.phase='done';msg='Přestřeleno – figurka zůstává na místě'}else msg='Zatím '+state.progress+' z '+target;state.log=[msg,...state.log].slice(0,8);if(state.used[di])state.dieIndex=state.dice.findIndex((d,i)=>!state.used[i]);if(state.darts>=3)state.phase='done';finishCheck();mult=1;save();render()}function renderGame(){document.getElementById('phase').textContent='Kostka → vybrat figurku a hod → skutečné zásahy šipkami';let panel=document.getElementById('dicePanel');if(!panel){panel=document.createElement('div');panel.id='dicePanel';panel.className='panel';document.getElementById('board').before(panel)}let remaining=state.dice.map((d,i)=>`<button ${state.used[i]?'disabled':''} class="${state.dieIndex===i?'active':''}" onclick="pickDie(${i})">🎲 ${d}${state.used[i]?' ✓':''}</button>`).join('');panel.innerHTML=`<strong>Skutečná kostka – zadej hody</strong><div class="row" style="margin:8px 0">${[1,2,3,4,5,6].map(n=>`<button ${state.phase!=='dice'?'disabled':''} onclick="roll(${n})">${n}</button>`).join('')}</div><div class="row">${remaining||'<small>Zatím žádný hod</small>'}</div><div class="row" style="margin-top:8px"><button onclick="startThrow()" ${state.phase!=='dice'?'disabled':''}>Hotovo, házet šipky</button><button onclick="deploy()" ${state.phase!=='throw'?'disabled':''}>Nasadit figurku (6)</button></div>`;document.getElementById('entryTitle').textContent='Zadej skutečný zásah (S / D / T)';document.getElementById('multipliers').classList.remove('hidden');let q=state.players[state.turn].pieces[state.selected],di=state.dieIndex;if(di===undefined||state.used[di])di=state.dice.findIndex((d,i)=>!state.used[i]);let d=state.dice[di];document.getElementById('message').textContent=state.winner!==null?'🏆 Vítěz!':state.phase==='dice'?'Zadej hody kostkou, pak klepni na „Hotovo“':state.phase==='done'?'Tah skončil. Přepni hráče.':`Vybraná figurka ${state.selected+1}: ${q.pos===null?'čeká na 6':q.pos==='home'?'doma':q.pos===0?'START':q.pos==='before3'?'PŘED 3':q.pos}. ${d===undefined?'Vyber zbývající kostku.':'Kostka '+d+', cíl '+((Number(q.pos)||0)+d)+', zásahy '+state.progress}. ${state.log[0]||''}`;}</script></body></html>
